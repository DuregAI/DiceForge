<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glimblehop — menu asset preview</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#1c2219;color:#f4e9d3;font-family:Georgia,serif}h1{font-size:24px}p{color:#c1c5b4}main{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}.screen{position:relative;overflow:hidden;background-size:100% 100%;box-shadow:0 8px 32px #0008;container-type:inline-size}.landscape{width:min(100%,1100px);aspect-ratio:1672/941;background-image:url('../../../Assets/_Project/07_Art/UI/GlimblehopMenu/background-landscape.png')}.portrait{width:min(100%,400px);aspect-ratio:941/1672;background-image:url('../../../Assets/_Project/07_Art/UI/GlimblehopMenu/background-portrait.png')}.logo{position:absolute;object-fit:contain;left:3%;top:9%;width:39%}.tagline{position:absolute;top:33%;left:3%;width:38%;text-align:center;font-size:1.65cqw;text-shadow:0 2px 3px #000}.menu{position:absolute;left:4%;top:41%;width:29%;display:grid;gap:1cqw}.btn{border:0;background:transparent center/100% 100% no-repeat;color:#25190e;font-family:Georgia,serif;font-weight:bold;font-size:1.5cqw;height:5.2cqw;cursor:pointer;transition:filter .12s,transform .12s}.btn:hover{filter:brightness(1.12);transform:scale(1.025)}.btn:active{transform:scale(.97);filter:brightness(.9)}.primary{background-image:url('../../../Assets/_Project/07_Art/UI/GlimblehopMenu/button-primary.png');height:7.2cqw;color:#fff1d5;font-size:2.9cqw;text-shadow:0 2px 2px #352714}.secondary{background-image:url('../../../Assets/_Project/07_Art/UI/GlimblehopMenu/button-secondary.png');width:83%;justify-self:center}.arrow{height:1.6cqw;margin-left:1.3cqw}.profile{position:absolute;left:2%;top:2%;display:flex;align-items:center;font-size:1.7cqw;background:#281e13cc;border-radius:40px;padding-right:1.4cqw}.profile img{width:5.3cqw;margin-right:.7cqw}.wallet{position:absolute;right:7%;top:2%;display:flex;gap:.8cqw;align-items:center;font-size:1.7cqw;background:#281e13cc;border-radius:40px;padding:.4cqw 1cqw}.wallet img{width:2.6cqw}.settings,.audio{position:absolute;width:3.6cqw;height:3.6cqw;right:2%;top:2%;border:0;background:transparent;padding:0}.settings img,.audio img{width:100%}.audio{top:auto;bottom:2%}.chapter{position:absolute;left:6%;top:78%;display:flex;align-items:center;gap:.7cqw;font-size:1.2cqw}.chapter img{width:2.5cqw}.dots{position:absolute;left:12%;top:83%;display:flex;gap:.7cqw}.dots img{width:1.1cqw}.portrait .logo{top:7%;left:5%;width:90%}.portrait .tagline{top:22%;left:5%;width:90%;font-size:3.5cqw}.portrait .menu{left:7%;top:73%;width:86%;grid-template-columns:1fr 1fr;gap:2cqw}.portrait .primary{grid-column:1/3;height:16cqw;font-size:8cqw}.portrait .secondary{width:100%;height:10cqw;font-size:3.2cqw}.portrait .arrow{height:5cqw}.portrait .profile{font-size:4cqw}.portrait .profile img{width:11cqw}.portrait .wallet{right:16%;font-size:4cqw;padding:1cqw 2cqw}.portrait .wallet img{width:6cqw}.portrait .settings,.portrait .audio{width:9cqw;height:9cqw;right:3%}.portrait .chapter{top:92%;left:21%;font-size:2.8cqw}.portrait .chapter img{width:5cqw}.portrait .dots{top:95%;left:41%;gap:1.5cqw}.portrait .dots img{width:2.5cqw}
</style>
<h1>Glimblehop — layered menu preview</h1>
<p>Live text over separate PNG assets. Layout reference only; buttons do not launch the game.</p>
<main id="previews"></main>
<script>
const base='../../../Assets/_Project/07_Art/UI/GlimblehopMenu/';
const img=(name,cls='')=>`<img class="${cls}" src="${base}${name}.png" alt="">`;
for(const mode of ['landscape','portrait']){
 const screen=document.createElement('section');screen.className='screen '+mode;screen.setAttribute('aria-label',mode+' preview');
 screen.innerHTML=`${img('logo','logo')}<div class="tagline">Little feet. Big mischief.</div><div class="profile">${img('avatar')}Lv. 6</div><div class="wallet">${img('coin')}103</div><button class="settings" aria-label="Settings preview">${img('settings')}</button><div class="menu"><button class="btn primary">PLAY ${img('play-arrow','arrow')}</button><button class="btn secondary">MY GOBLINS</button><button class="btn secondary">HOW TO PLAY</button></div><div class="chapter">${img('forest')}Chapter 1 · Woodland Trail</div><div class="dots">${img('progress-active')}${img('progress-idle')}${img('progress-idle')}${img('progress-idle')}</div><button class="audio" aria-label="Toggle audio icon preview">${img('audio-on')}</button>`;
 screen.querySelector('.audio').onclick=e=>{const icon=e.currentTarget.querySelector('img');icon.src=icon.src.endsWith('/audio-on.png')?base+'audio-off.png':base+'audio-on.png';};
 document.querySelector('#previews').append(screen);
}
</script>
</html>
